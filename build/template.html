<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DQ Enablement Studio</title>
<style>
__TOKENS_CSS__
</style>
<style>
__PATTERNS_CSS__
</style>
<style>
/* ============ theme: light is the kit default; dark overrides the same tokens ============ */
:root{--surface:#FFFFFF;--surface-2:#F7F9FD;--code-bg:#101736;--code-fg:#E8EEFC;--chip-ink:#7E8EB8}
[data-theme="dark"]{
  --canvas:#0F1530;--panel:#161F45;--surface:#1A2350;--surface-2:#1F2A5C;--line:rgba(255,255,255,.13);
  --ink:#EEF2FF;--muted:#AEC0E8;--slate:#AEC0E8;--dim:#7E8EB8;--chip-ink:#AEC0E8;
  --blue:#83AFF8;--primary:#83AFF8;--violet-soft:#A693F7;
  --glass-fill:linear-gradient(152deg,rgba(26,35,80,.88),rgba(22,31,69,.72) 58%,rgba(16,23,54,.8));
  --glass-hairline:rgba(255,255,255,.10);
  --glass-shadow:0 10px 34px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.06);
  --shadow-glass:0 10px 34px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.06);
  --shadow-raised:0 16px 44px rgba(0,0,0,.45),0 4px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.06);
  --warn-bg:rgba(180,83,9,.18);--warn-line:rgba(245,217,168,.3);--warn:#F5C98A;--good:#4ADE9C;--critical:#F87171;
  --code-bg:#0A0F24;--code-fg:#E8EEFC;
}
[data-theme="dark"] body{background:var(--canvas);color:var(--ink)}
[data-theme="dark"] body::before{
  background:
    radial-gradient(60% 50% at 12% 8%, rgba(91,48,238,.22), transparent 60%),
    radial-gradient(50% 45% at 88% 12%, rgba(54,94,185,.22), transparent 60%),
    radial-gradient(55% 50% at 80% 90%, rgba(131,175,248,.12), transparent 60%),
    radial-gradient(45% 40% at 15% 85%, rgba(188,175,255,.10), transparent 60%);
}
[data-theme="dark"] .card{border-color:var(--glass-hairline)}
[data-theme="dark"] .typechip.tc-reference,[data-theme="dark"] .typechip.tc-glossary{color:#101736}
[data-theme="dark"] .tc-principle{background:#A693F7;color:#101736}
[data-theme="dark"] .tc-qa{background:#C9B8FF;color:#101736}
[data-theme="dark"] .hd nav a.on{background:rgba(131,175,248,.16)}
[data-theme="dark"] .graph-legend{background:rgba(22,31,69,.85)}
[data-theme="dark"] .gnode text{fill:#EEF2FF}
[data-theme="dark"] .gdom{fill:rgba(238,242,255,.3)}
[data-theme="dark"] .gedge{stroke:rgba(131,175,248,.18)}
[data-theme="dark"] .unit-body code{background:rgba(131,175,248,.14);color:#C9D8FF}
[data-theme="dark"] .unit-body blockquote{background:var(--surface-2)}
[data-theme="dark"] .callout{background:var(--surface-2)}
[data-theme="dark"] .co-note,[data-theme="dark"] .co-info,[data-theme="dark"] .co-example{background:rgba(131,175,248,.08)}
[data-theme="dark"] .co-tip,[data-theme="dark"] .co-success{background:rgba(74,222,156,.08)}
[data-theme="dark"] .st-draft{background:var(--surface-2)}
[data-theme="dark"] .quiz .opt.correct{background:rgba(74,222,156,.12)}
[data-theme="dark"] .quiz .opt.wrong{background:rgba(248,113,113,.12)}
[data-theme="dark"] .quiz .fb.ok{background:rgba(74,222,156,.12)}
[data-theme="dark"] .prog .bar{background:rgba(131,175,248,.18)}
[data-theme="dark"] dialog.rv-dlg{background:var(--surface);color:var(--ink)}
[data-theme="dark"] dialog.rv-dlg::backdrop{background:rgba(0,0,0,.6)}
@media print{[data-theme="dark"] body{background:#fff;color:#20242E}}
.theme-toggle{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-fine);font-weight:var(--fw-semibold);color:var(--muted);border:1px solid var(--line);border-radius:var(--r-button);background:var(--surface);padding:6px 10px;cursor:pointer;font-family:inherit}
.theme-toggle i{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--violet));display:inline-block;box-shadow:inset -4px -3px 0 0 var(--surface)}
[data-theme="dark"] .theme-toggle i{box-shadow:none}
</style>
<style>
/* ============ app chrome (layout only; look comes from kit tokens/patterns) ============ */
html,body{margin:0}
body{font-family:var(--font-sans);font-size:var(--fs-body);line-height:var(--lh-normal);-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 var(--sp-5)}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* header */
header.app{position:sticky;top:0;z-index:50;background:var(--glass-fill);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-3) var(--sp-5);max-width:1120px;margin:0 auto}
.hd .brand{display:flex;align-items:center;gap:var(--sp-3);cursor:pointer;flex:none}
.brand-logo{height:30px;width:auto;display:block}
.brand-txt{display:flex;flex-direction:column}
/* brand icons (inlined from syniti-brand-kit, currentColor) */
.bi{width:15px;height:15px;display:inline-block;vertical-align:-3px;flex:none}
.sb-ic{color:var(--dim);display:inline-flex}
.sb-ic .bi{width:14px;height:14px}
.rv-toggle .bi{width:14px;height:14px;margin-right:2px}
.btn .bi{width:13px;height:13px;margin-right:2px}
.hd .eyebrow{font-size:var(--fs-micro);font-weight:var(--fw-bold);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--blue)}
.hd .title{font-size:15px;font-weight:var(--fw-bold);color:var(--ink);letter-spacing:-.01em}
.hd nav{display:flex;gap:var(--sp-1);flex-wrap:wrap}
.hd nav a{font-size:var(--fs-fine);font-weight:var(--fw-semibold);color:var(--muted);padding:5px 10px;border-radius:var(--r-chip)}
.hd nav a.on{color:var(--ink);background:rgba(54,94,185,.10)}
.hd nav a:hover{text-decoration:none;color:var(--ink)}
.hd .sp{flex:1}
.searchbox{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r-control);background:var(--surface);padding:6px 10px;min-width:210px}
.searchbox input{border:none;outline:none;font:inherit;font-size:var(--fs-fine);width:100%;background:transparent;color:var(--ink)}
.searchbox kbd{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--panel)}
.rv-toggle{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-fine);font-weight:var(--fw-semibold);color:var(--muted);border:1px solid var(--line);border-radius:var(--r-button);background:var(--surface);padding:6px 11px;cursor:pointer;font-family:inherit}
.rv-toggle.on{color:#fff;background:var(--accent);border-color:var(--accent)}
.rv-badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;border-radius:9px;background:var(--violet-soft);color:#fff;font-size:10px;font-weight:700;padding:0 4px}
.rv-toggle.on .rv-badge{background:rgba(255,255,255,.28)}

main{padding:var(--sp-8) 0 var(--sp-12)}
.view-title{font-size:22px;font-weight:var(--fw-bold);letter-spacing:-.01em;color:var(--ink);margin:0 0 var(--sp-2)}
.lede{color:var(--muted);max-width:64ch;margin:0 0 var(--sp-6)}

/* home */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--sp-3);margin:var(--sp-6) 0}
.stat{padding:var(--sp-4);cursor:pointer;transition:transform var(--dur-fast) var(--ease-standard)}
.stat:hover{transform:translateY(var(--hover-lift))}
.stat .n{font-size:26px;font-weight:var(--fw-bold);color:var(--ink);font-variant-numeric:var(--num-tabular)}
.stat .l{font-size:var(--fs-fine);font-weight:var(--fw-semibold);color:var(--muted);margin-top:2px}
.home-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:var(--sp-5);align-items:start}
@media(max-width:820px){.home-grid{grid-template-columns:1fr}}
.path-card{padding:var(--sp-5);margin-bottom:var(--sp-4);cursor:pointer;transition:transform var(--dur-fast) var(--ease-standard)}
.path-card:hover{transform:translateY(var(--hover-lift))}
.path-card .t{font-size:var(--fs-title);font-weight:var(--fw-semibold);color:var(--ink)}
.path-card .d{font-size:var(--fs-fine);color:var(--slate);margin-top:4px;line-height:var(--lh-normal)}
.prog{display:flex;align-items:center;gap:8px;margin-top:var(--sp-3)}
.prog .bar{flex:1;height:6px;border-radius:3px;background:rgba(54,94,185,.12);overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--violet));border-radius:3px}
.prog .pc{font-size:10px;font-weight:700;color:var(--muted);font-variant-numeric:var(--num-tabular)}
.recent li{margin:6px 0;font-size:var(--fs-fine)}
.recent .dt{color:var(--dim);font-variant-numeric:var(--num-tabular);margin-left:6px;font-size:10px}

/* chips + badges */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--chip-ink);border:1px solid var(--line);border-radius:var(--r-chip);padding:2px 8px;background:var(--panel);cursor:pointer;font-family:inherit}
.chip.on{color:#fff;background:var(--blue);border-color:var(--blue)}
.typechip{display:inline-flex;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:var(--r-chip);padding:2px 7px;color:#fff}
.tc-concept{background:var(--blue)}.tc-principle{background:var(--navy)}.tc-standard{background:var(--violet)}
.tc-procedure{background:var(--slate-blue)}.tc-reference{background:var(--light-blue);color:var(--navy)}
.tc-glossary{background:var(--lavender);color:var(--navy)}.tc-qa{background:var(--deep)}
.st-pill{display:inline-flex;font-size:10px;font-weight:700;border-radius:var(--r-chip);padding:2px 7px}
.st-approved{color:var(--good);background:rgba(14,159,110,.10)}
.st-review{color:var(--warn);background:var(--warn-bg)}
.st-draft{color:var(--muted);background:var(--panel);border:1px solid var(--line)}
.st-deprecated{color:var(--critical);background:rgba(220,38,38,.08)}

/* browse */
.facets{display:flex;gap:6px;flex-wrap:wrap;margin:var(--sp-4) 0}
.unit-list{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)}
@media(max-width:820px){.unit-list{grid-template-columns:1fr}}
.unit-card{padding:var(--sp-4) var(--sp-5);cursor:pointer;transition:transform var(--dur-fast) var(--ease-standard)}
.unit-card:hover{transform:translateY(var(--hover-lift))}
.unit-card .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.unit-card .t{font-size:var(--fs-title);font-weight:var(--fw-semibold);color:var(--ink);margin-top:7px;line-height:var(--lh-tight)}
.unit-card .m{font-size:var(--fs-fine);color:var(--slate);margin-top:4px}
.unit-card.deprecated{opacity:.55}

/* unit page */
.unit-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:var(--sp-3)}
.unit-body{padding:var(--sp-6) var(--sp-8)}
@media(max-width:720px){.unit-body{padding:var(--sp-5)}}
.unit-body h2{font-size:17px;font-weight:var(--fw-bold);color:var(--ink);margin:var(--sp-6) 0 var(--sp-3);letter-spacing:-.01em}
.unit-body h2:first-child{margin-top:0}
.unit-body h3{font-size:14px;font-weight:var(--fw-semibold);color:var(--navy);margin:var(--sp-5) 0 var(--sp-2)}
.unit-body p{margin:0 0 var(--sp-3);color:var(--ink);line-height:var(--lh-relaxed)}
.unit-body li{margin:6px 0;line-height:var(--lh-relaxed);word-break:break-word;overflow-wrap:break-word;display:block}
.unit-body li strong,.unit-body li b{display:inline;word-break:break-word;overflow-wrap:break-word}
.unit-body ul,.unit-body ol{width:100%;box-sizing:border-box}
.unit-body code{font-size:12px;background:rgba(54,94,185,.08);border-radius:4px;padding:1px 5px;color:var(--navy)}
.unit-body pre{background:var(--code-bg);color:var(--code-fg);border-radius:var(--r-panel);padding:var(--sp-4) var(--sp-5);overflow-x:auto;font-size:12px;line-height:1.55}
.unit-body pre code{background:none;color:inherit;padding:0;font-size:12px}
.sql-k{color:#83AFF8;font-weight:600}
.tbl-wrap{overflow-x:auto;margin:0 0 var(--sp-4)}
.unit-body table{border-collapse:collapse;width:100%;font-size:var(--fs-fine)}
.unit-body th{text-align:left;font-weight:var(--fw-semibold);color:var(--navy);border-bottom:2px solid var(--line);padding:7px 10px}
.unit-body td{border-bottom:1px solid var(--line);padding:7px 10px;vertical-align:top;line-height:1.5}
.unit-body blockquote{margin:0 0 var(--sp-4);padding:var(--sp-3) var(--sp-4);border-left:3px solid var(--slate-blue);background:var(--panel);border-radius:0 var(--r-chip) var(--r-chip) 0;color:var(--slate)}
.callout{margin:0 0 var(--sp-4);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-panel);border:1px solid var(--line);background:var(--panel)}
.callout .co-title{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.callout p{margin:0;font-size:var(--fs-fine);color:var(--slate)}
.co-note,.co-info,.co-example{border-color:rgba(54,94,185,.25);background:rgba(54,94,185,.05)}
.co-note .co-title,.co-info .co-title,.co-example .co-title{color:var(--blue)}
.co-tip,.co-success{border-color:rgba(14,159,110,.25);background:rgba(14,159,110,.05)}
.co-tip .co-title,.co-success .co-title{color:var(--good)}
.co-warning,.co-important{border-color:var(--warn-line);background:var(--warn-bg)}
.co-warning .co-title,.co-important .co-title{color:var(--warn)}
.wl-broken{color:var(--critical);border-bottom:1px dashed var(--critical)}
.unit-side{margin-top:var(--sp-5);display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)}
@media(max-width:720px){.unit-side{grid-template-columns:1fr}}
.side-card{padding:var(--sp-4) var(--sp-5)}
.side-card .h{font-size:var(--fs-micro);font-weight:var(--fw-bold);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--blue);margin-bottom:var(--sp-2)}
.side-card ul{margin:0;padding:0;list-style:none}
.side-card li{margin:5px 0;font-size:var(--fs-fine)}
.rel-tag{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:5px}
.src-line{font-size:var(--fs-fine);color:var(--slate);margin:4px 0;word-break:break-all}
.src-line .ev-chip{margin-right:6px}
.pathnav{display:flex;justify-content:space-between;gap:var(--sp-3);margin-top:var(--sp-5)}

/* quiz */
.quiz{padding:var(--sp-5);margin-top:var(--sp-5)}
.quiz .q{font-size:var(--fs-body);font-weight:var(--fw-semibold);color:var(--ink);margin-bottom:var(--sp-3)}
.quiz .opt{display:block;width:100%;text-align:left;font:inherit;font-size:var(--fs-fine);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-control);padding:9px 12px;margin:6px 0;cursor:pointer;transition:border-color var(--dur-fast)}
.quiz .opt:hover{border-color:var(--slate-blue)}
.quiz .opt.correct{border-color:var(--good);background:rgba(14,159,110,.07)}
.quiz .opt.wrong{border-color:var(--critical);background:rgba(220,38,38,.05)}
.quiz .fb{margin-top:var(--sp-3);font-size:var(--fs-fine);line-height:var(--lh-relaxed);border-radius:var(--r-chip);padding:var(--sp-3)}
.quiz .fb.ok{color:var(--good);background:rgba(14,159,110,.07)}
.quiz .fb.no{color:var(--warn);background:var(--warn-bg)}

/* path view */
.step{display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface);margin-bottom:var(--sp-2);cursor:pointer}
.step:hover{border-color:var(--slate-blue)}
.step .ck{width:20px;height:20px;flex:none;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;margin-top:1px}
.step.done .ck{background:var(--good);border-color:var(--good)}
.step .ck .bi{width:11px;height:11px;vertical-align:0}
.step .st-t{font-size:var(--fs-body);font-weight:var(--fw-medium);color:var(--ink)}
.step .st-m{font-size:var(--fs-fine);color:var(--slate)}

/* reinforce section (path steps) */
.reinforce{margin-top:var(--sp-6);border-top:1px dashed rgba(54,94,185,.25);padding-top:var(--sp-4)}
.rf-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-2)}
.ck-done{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--good)}
.ck-done .bi{width:11px;height:11px}

/* search */
.results li{list-style:none;margin:0 0 var(--sp-2)}
.results{padding:0}

/* graph */
#graph-wrap{height:640px;position:relative;overflow:hidden;padding:0}
#graph-svg{width:100%;height:100%;cursor:grab}
.gnode{cursor:pointer}
.gnode text{font-size:9px;fill:var(--ink);pointer-events:none;font-family:var(--font-sans)}
.gnode circle{stroke:#fff;stroke-width:1.5}
.gedge{stroke:rgba(54,94,185,.13);stroke-width:.8}
.graph-legend{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;background:rgba(255,255,255,.85);border-radius:var(--r-chip);padding:6px 10px;font-size:10px;color:var(--slate)}
.graph-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}
.gdom{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;fill:rgba(35,47,99,.35);text-anchor:middle;pointer-events:none;font-family:var(--font-sans)}
.gd-sel{width:auto;font-size:10px;font-weight:600;padding:3px 8px;color:var(--chip-ink)}
.gt-chip{transition:background var(--dur-fast),color var(--dur-fast)}

/* review mode */
.rv-panel{position:fixed;right:var(--sp-4);bottom:var(--sp-4);z-index:60;width:300px;max-height:60vh;overflow:auto;padding:var(--sp-4)}
.rv-panel .h{font-size:var(--fs-fine);font-weight:var(--fw-bold);color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.rv-panel .op-line{font-size:10px;color:var(--slate);border-bottom:1px dashed var(--line);padding:5px 0}
.rv-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--sp-3)}
.btn{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:var(--fs-fine);font-weight:var(--fw-semibold);border-radius:var(--r-button);padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{font-size:10px;padding:4px 9px}
.rv-unit-bar{display:flex;gap:6px;flex-wrap:wrap;margin:var(--sp-3) 0}
textarea.rv-ta{width:100%;min-height:180px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;border:1px solid var(--line);border-radius:var(--r-control);padding:var(--sp-3);box-sizing:border-box;background:var(--surface);color:var(--ink)}
input.rv-in{width:100%;font:inherit;font-size:var(--fs-fine);border:1px solid var(--line);border-radius:var(--r-control);padding:8px 10px;box-sizing:border-box;background:var(--surface);color:var(--ink)}
dialog.rv-dlg{border:none;border-radius:var(--r-card);box-shadow:var(--shadow-raised);padding:var(--sp-5);width:min(560px,92vw)}
dialog.rv-dlg::backdrop{background:rgba(25,0,51,.35)}
.dlg-h{font-size:var(--fs-title);font-weight:var(--fw-bold);color:var(--ink);margin-bottom:var(--sp-3)}

/* print */
@media print{
  header.app,.rv-panel,.rv-unit-bar,.pathnav,.facets{display:none!important}
  body::before{display:none}
  .card{box-shadow:none;border:1px solid #ddd;-webkit-backdrop-filter:none;backdrop-filter:none;background:#fff}
  main{padding:0}
}
.empty{color:var(--muted);font-size:var(--fs-fine);padding:var(--sp-6);text-align:center}
footer.app{border-top:1px solid var(--line);padding:var(--sp-4) 0;color:var(--dim);font-size:10px}
footer.app .wrap{display:flex;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap}
</style>
</head>
<body>
<header class="app">
  <div class="hd">
    <div class="brand" onclick="location.hash='#/'">
      <img class="brand-logo" src="__LOGO_IMG__" alt="Syniti, part of Capgemini">
      <div class="brand-txt">
        <span class="eyebrow">DQ CoE</span>
        <span class="title">DQ Enablement Studio</span>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sp"></div>
    <div class="searchbox" onclick="document.getElementById('q').focus()">
      <span class="sb-ic">__ICON_SEARCH__</span>
      <input id="q" placeholder="Search the methodology…" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <button class="theme-toggle" id="theme-toggle" title="Switch light / dark"><i></i><span id="theme-label">Dark</span></button>
    <button class="rv-toggle" id="rv-toggle" title="Review mode: propose edits, notes, questions and flags, then export them as a changeset">
      __ICON_EDIT__ Review <span class="rv-badge" id="rv-badge" hidden>0</span>
    </button>
  </div>
</header>

<main><div class="wrap" id="app"></div></main>

<footer class="app"><div class="wrap">
  <span>DQ Enablement Studio — the canonical Syniti DQ methodology knowledge base. Internal use only.</span>
  <span>build __BUILD_META__</span>
</div></footer>

<script type="application/json" id="em-data">__DATA_JSON__</script>
<script>
"use strict";
/* ---------------- theme ---------------- */
(function(){
  let saved = null; try { saved = localStorage.getItem("em.theme.v1"); } catch(e){}
  const sys = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  applyTheme(saved || sys, false);
  if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
    let s2 = null; try { s2 = localStorage.getItem("em.theme.v1"); } catch(_){}
    if (!s2) applyTheme(e.matches ? "dark" : "light", false);
  });
})();
function applyTheme(mode, persist){
  document.documentElement.setAttribute("data-theme", mode);
  const lbl = document.getElementById("theme-label");
  if (lbl) lbl.textContent = mode === "dark" ? "Light" : "Dark";
  if (persist){ try { localStorage.setItem("em.theme.v1", mode); } catch(e){} }
  if (window.__emReady){ syncGraphPalette(); if ((location.hash || "").startsWith("#/graph")) route(); }
}
const IC = {
  search: `__ICON_SEARCH__`, edit: `__ICON_EDIT__`, download: `__ICON_DOWNLOAD__`,
  question: `__ICON_QUESTION__`, check: `__ICON_CHECK__`, flag: `__ICON_FLAG__`,
  graph: `__ICON_GRAPH__`, learn: `__ICON_LEARN__`,
};
const DATA = JSON.parse(document.getElementById("em-data").textContent);
const U = DATA.units, TAX = DATA.taxonomy;
const $app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const typeChip = t => `<span class="typechip tc-${t}">${esc(TAX.types[t] ? TAX.types[t].label.replace(/s$/,"") : t)}</span>`;
const stPill = s => `<span class="st-pill st-${s}">${esc(s)}</span>`;
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------------- router ---------------- */
function route(){
  const h = location.hash || "#/";
  const parts = h.replace(/^#\//, "").split("/");
  const view = (parts[0] || "").split("?")[0];
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.v === view));
  window.scrollTo(0, 0);
  if (view === "") return renderHome();
  if (view === "browse") return renderBrowse(parts[1] || "all");
  if (view === "unit") return renderUnit(decodeURIComponent(parts[1] || ""));
  if (view === "path") return renderPath(decodeURIComponent(parts[1] || ""), parts.length > 2 ? parseInt(parts[2], 10) : NaN);
  if (view === "search") return renderSearch(decodeURIComponent((h.split("?q=")[1] || "")));
  if (view === "graph") return renderGraph(parts[1] ? decodeURIComponent(parts[1]) : null);
  renderHome();
}
document.getElementById("nav").innerHTML =
  `<a href="#/" data-v="">Home</a><a href="#/browse/all" data-v="browse">Browse</a><a href="#/graph" data-v="graph">Graph</a>`;
window.addEventListener("hashchange", route);

/* ---------------- home ---------------- */
function pathProgress(p){
  const done = store.get("em.progress.v1", {})[p.id] || {};
  const total = p.steps.length;
  const n = p.steps.filter((s, i) => done[i]).length;
  return { n, total, pct: total ? Math.round(100 * n / total) : 0 };
}
function renderHome(){
  const counts = {};
  Object.values(U).forEach(u => { counts[u.type] = (counts[u.type] || 0) + 1; });
  const stats = Object.keys(TAX.types).map(t =>
    `<div class="card stat" onclick="location.hash='#/browse/${t}'"><div class="n">${counts[t] || 0}</div><div class="l">${esc(TAX.types[t].label)}</div></div>`).join("");
  const paths = DATA.paths.map(p => {
    const pr = pathProgress(p);
    return `<article class="card path-card accent" style="--accent:var(--blue)" onclick="location.hash='#/path/${esc(p.id)}'">
      <div class="t">${esc(p.title)}</div><div class="d">${esc(p.blurb || "")}</div>
      <div class="prog"><div class="bar"><i style="width:${pr.pct}%"></i></div><span class="pc">${pr.n}/${pr.total}</span></div>
    </article>`;
  }).join("") || `<p class="empty">Learning paths arrive with the corpus seed.</p>`;
  const recent = Object.values(U).sort((a, b) => (b.updated || "").localeCompare(a.updated || "")).slice(0, 8)
    .map(u => `<li><a href="#/unit/${u.id}">${esc(u.title)}</a><span class="dt">${esc(u.updated || "")}</span></li>`).join("");
  $app.innerHTML = `
    <div class="eyebrow">The canonical DQ methodology</div>
    <h1 class="view-title">Everything the CoE knows, in one place</h1>
    <p class="lede">Concepts, principles, standards, procedures, reference, the shared glossary and real Q&amp;A —
      searchable, cross-referenced, and enrichable. Use <b>Review</b> mode to propose edits or ask questions; exports land with the CoE.</p>
    <div class="stat-row">${stats}</div>
    <div class="home-grid">
      <section><div class="eyebrow" style="margin-bottom:var(--sp-3)">Learning paths</div>${paths}</section>
      <section class="card" style="padding:var(--sp-5)"><div class="eyebrow" style="margin-bottom:var(--sp-2)">Recently updated</div>
        <ul class="recent" style="margin:0;padding:0;list-style:none">${recent}</ul></section>
    </div>`;
}

/* ---------------- browse ---------------- */
const facetState = { domain: null, audience: null, level: null, showDeprecated: false };
function renderBrowse(type){
  const all = Object.values(U).filter(u => type === "all" || u.type === type);
  const tabs = ["all"].concat(Object.keys(TAX.types)).map(t =>
    `<button class="chip ${t === type ? "on" : ""}" onclick="location.hash='#/browse/${t}'">${t === "all" ? "All" : esc(TAX.types[t].label)}</button>`).join("");
  const domains = [...new Set(all.map(u => u.domain))].sort();
  const fchips = domains.map(d =>
    `<button class="chip ${facetState.domain === d ? "on" : ""}" onclick="setFacet('domain','${esc(d)}')">${esc(d)}</button>`).join("");
  const lchips = TAX.levels.map(l =>
    `<button class="chip ${facetState.level === l ? "on" : ""}" onclick="setFacet('level','${esc(l)}')">${esc(l)}</button>`).join("");
  let list = all.filter(u =>
    (!facetState.domain || u.domain === facetState.domain) &&
    (!facetState.level || u.level === facetState.level) &&
    (facetState.showDeprecated || u.status !== "deprecated"));
  list.sort((a, b) => a.title.localeCompare(b.title));
  const cards = list.map(unitCard).join("") || `<p class="empty">Nothing here yet.</p>`;
  $app.innerHTML = `
    <h1 class="view-title">Browse</h1>
    <div class="facets">${tabs}</div>
    <div class="facets"><span class="chip" style="cursor:default;border:none;background:none">Tags:</span>${fchips}
      <span class="chip" style="cursor:default;border:none;background:none">level:</span>${lchips}
      <button class="chip ${facetState.showDeprecated ? "on" : ""}" onclick="facetState.showDeprecated=!facetState.showDeprecated;route()">show deprecated</button></div>
    <div class="unit-list">${cards}</div>`;
}
function setFacet(k, v){ facetState[k] = facetState[k] === v ? null : v; route(); }
function unitCard(u){
  return `<article class="card unit-card ${u.status === "deprecated" ? "deprecated" : ""}" onclick="location.hash='#/unit/${u.id}'">
    <div class="row1">${typeChip(u.type)}${u.kind ? `<span class="chip" style="cursor:default">${esc(u.kind)}</span>` : ""}${stPill(u.status)}</div>
    <div class="t">${esc(u.title)}</div>
    <div class="m">${esc(u.domain)} · ${esc(u.level)}${u.tags && u.tags.length ? " · " + esc(u.tags.join(", ")) : ""}</div>
  </article>`;
}

/* ---------------- unit ---------------- */
function renderUnit(id, pathCtx, suppressQuizzes){
  if (DATA.redirects[id] && !U[id]) id = DATA.redirects[id];
  const u = U[id];
  if (!u){ $app.innerHTML = `<p class="empty">Unknown unit <code>${esc(id)}</code>.</p>`; return; }
  const relGroups = {};
  (u.links || []).forEach(l => { (relGroups[l.rel] = relGroups[l.rel] || []).push(l.to); });
  const outRefs = Object.keys(relGroups).sort().map(rel =>
    relGroups[rel].map(t => `<li><span class="rel-tag">${esc(TAX.link_relations[rel] ? rel : rel)}</span><a href="#/unit/${t}">${esc(U[t] ? U[t].title : t)}</a></li>`).join("")).join("");
  const inRefs = (u.inbound || []).map(e =>
    `<li><span class="rel-tag">${esc(e.rel)}</span><a href="#/unit/${e.from}">${esc(U[e.from] ? U[e.from].title : e.from)}</a></li>`).join("");
  const sources = (u.sources || []).map(s => {
    const key = s.split(":", 1)[0];
    return `<div class="src-line"><span class="ev-chip">${esc(key)}</span>${esc(s.slice(key.length + 1))}</div>`;
  }).join("");
  const quizzes = suppressQuizzes ? "" :
    Object.values(DATA.assessments).filter(a => a.unit_id === id).map(a => quizHtml(a)).join("");
  const supNote = u.supersedes && U[u.supersedes] ?
    `<div class="htr" style="margin-bottom:var(--sp-3)">Supersedes <a href="#/unit/${u.supersedes}">${esc(U[u.supersedes].title)}</a>.</div>` : "";
  const depNote = u.status === "deprecated" ?
    `<div class="dir-tag" style="margin-bottom:var(--sp-3)">deprecated${DATA.redirects[id] ? ` — superseded by <a href="#/unit/${DATA.redirects[id]}">${esc(U[DATA.redirects[id]].title)}</a>` : ""}</div>` : "";
  $app.innerHTML = `
    <div class="unit-hd">${typeChip(u.type)}${u.kind ? `<span class="chip" style="cursor:default">${esc(u.kind)}</span>` : ""}${stPill(u.status)}
      <span class="chip" style="cursor:default">${esc(u.domain)}</span><span class="chip" style="cursor:default">${esc(u.level)}</span>
      <span class="chip" style="cursor:default">↻ ${esc(u.updated)}</span>
      <span class="sp" style="flex:1"></span>
      <button class="btn small" onclick="window.print()">Print</button>
      <button class="btn small" onclick="location.hash='#/graph/${id}'">${IC.graph} In graph</button></div>
    <h1 class="view-title">${esc(u.title)}</h1>
    ${depNote}${supNote}
    <div class="rv-unit-bar" id="rv-unit-bar" ${reviewOn ? "" : "hidden"}>
      <button class="btn small" onclick="rvEdit('${id}')">${IC.edit} Propose edit</button>
      <button class="btn small" onclick="rvNote('${id}')">${IC.edit} Add note</button>
      <button class="btn small" onclick="rvQuestion('${id}')">${IC.question} Ask question</button>
      <button class="btn small" onclick="rvFlag('${id}')">${IC.flag} Flag</button></div>
    <article class="card unit-body">${u.html}</article>
    ${quizzes}
    <div class="unit-side">
      <div class="card side-card"><div class="h">Cross-references</div><ul>${outRefs || "<li class='empty' style='padding:0;text-align:left'>none yet</li>"}</ul></div>
      <div class="card side-card"><div class="h">Referenced by</div><ul>${inRefs || "<li class='empty' style='padding:0;text-align:left'>nothing yet</li>"}</ul></div>
      <div class="card side-card" style="grid-column:1/-1"><div class="h">Sources</div>${sources}</div>
    </div>
    ${pathCtx || ""}`;
}

/* ---------------- quiz ---------------- */
let quizSeq = 0;
function quizHtml(a, ctx){
  // ctx (optional): {path, step, checks} — this quiz is a reinforce check inside a path step
  if (a.kind === "sql_practice"){
    return `<article class="card quiz"><div class="eyebrow" style="margin-bottom:var(--sp-2)">SQL practice</div>
      <div class="q">${esc(a.prompt)}</div>${a.starter_sql ? `<pre><code>${esc(a.starter_sql)}</code></pre>` : ""}
      ${a.expected_notes ? `<div class="htr">${esc(a.expected_notes)}</div>` : ""}</article>`;
  }
  const qid = "qz" + (++quizSeq);
  const answered = store.get("em.checks.v1", {})[a.id];
  const opts = Object.keys(a.options).sort().map(k =>
    `<button class="opt" data-k="${esc(k)}" onclick="answerQuiz('${qid}','${esc(a.id)}','${esc(k)}')"><b>${esc(k)}.</b> ${esc(a.options[k])}</button>`).join("");
  if (ctx) quizCtx[a.id] = ctx;
  return `<article class="card quiz" id="${qid}" data-aid="${esc(a.id)}">
    <div class="eyebrow" style="margin-bottom:var(--sp-2);display:flex;align-items:center;gap:6px">Knowledge check
      ${answered ? `<span class="ck-done">${IC.check} done</span>` : ""}</div>
    <div class="q">${esc(a.question)}</div>${opts}<div class="fb" hidden></div></article>`;
}
const quizCtx = {};
function answerQuiz(qid, aid, k){
  const a = DATA.assessments[aid], box = document.getElementById(qid);
  if (!a || !box) return;
  const fb = box.querySelector(".fb");
  box.querySelectorAll(".opt").forEach(o => {
    o.classList.remove("correct", "wrong");
    if (o.dataset.k === a.answer) o.classList.add("correct");
    else if (o.dataset.k === k) o.classList.add("wrong");
  });
  const ok = k === a.answer;
  fb.hidden = false;
  fb.className = "fb " + (ok ? "ok" : "no");
  fb.textContent = ok ? (a.feedback_correct || "Correct.")
    : ((a.feedback_incorrect && a.feedback_incorrect[k]) || a.feedback_incorrect_default || "Not quite — the highlighted answer is correct. " + (a.feedback_correct || ""));
  if (!ok) return;
  const answered = store.get("em.checks.v1", {});
  answered[aid] = true;
  store.set("em.checks.v1", answered);
  const ctx = quizCtx[aid];
  if (ctx){
    // step completes when every check of this step is answered correctly
    if (ctx.checks.every(c => answered[c])){
      markStep(ctx.path, ctx.step);
      const hint = document.getElementById("reinforce-state");
      if (hint) hint.innerHTML = `${IC.check} All checks passed — step complete`;
    }
  }
}

/* ---------------- paths ---------------- */
function markStep(pid, idx){
  const prog = store.get("em.progress.v1", {});
  (prog[pid] = prog[pid] || {})[idx] = true;
  store.set("em.progress.v1", prog);
}
function stepChecks(s){ return (s.checks || []).filter(c => DATA.assessments[c]); }
function renderPath(pid, stepIdx){
  const p = DATA.paths.find(x => x.id === pid);
  if (!p){ $app.innerHTML = `<p class="empty">Unknown path.</p>`; return; }
  const done = store.get("em.progress.v1", {})[pid] || {};
  const answered = store.get("em.checks.v1", {});
  if (isNaN(stepIdx) || stepIdx < 0 || !p.steps.length){
    const pr = pathProgress(p);
    const steps = p.steps.map((s, i) => {
      let title, meta;
      if (s.unit){
        const u = U[s.unit];
        title = u ? u.title : s.unit;
        const checks = stepChecks(s);
        meta = (u ? TAX.types[u.type].label : "unit") + (checks.length ? ` · ${checks.length} check${checks.length > 1 ? "s" : ""} to reinforce` : "");
      } else {
        const a = DATA.assessments[s.assessment];
        title = a ? (a.kind === "mcq" ? "Checkpoint question" : "SQL practice") : s.assessment;
        meta = "diagnostic";
      }
      return `<div class="step ${done[i] ? "done" : ""}" onclick="location.hash='#/path/${pid}/${i}'">
        <span class="ck">${done[i] ? IC.check : ""}</span><div><div class="st-t">${esc(title)}</div><div class="st-m">${esc(meta)}</div></div></div>`;
    }).join("");
    $app.innerHTML = `<div class="eyebrow" style="display:flex;align-items:center;gap:6px">${IC.learn} Learning path</div>
      <h1 class="view-title">${esc(p.title)}</h1>
      <p class="lede">${esc(p.blurb || "")}</p>
      <div class="prog" style="max-width:340px;margin-bottom:var(--sp-5)"><div class="bar"><i style="width:${pr.pct}%"></i></div><span class="pc">${pr.n}/${pr.total} complete</span></div>
      ${steps}`;
    return;
  }
  const s = p.steps[stepIdx];
  if (!s){ location.hash = "#/path/" + pid; return; }
  const nextHash = stepIdx + 1 < p.steps.length ? `#/path/${pid}/${stepIdx + 1}` : `#/path/${pid}`;
  const nav = (label) => `<div class="pathnav">
    ${stepIdx > 0 ? `<button class="btn" onclick="location.hash='#/path/${pid}/${stepIdx - 1}'">← Previous</button>` : `<button class="btn" onclick="location.hash='#/path/${pid}'">↑ Path overview</button>`}
    <button class="btn primary" onclick="markStep('${pid}',${stepIdx});location.hash='${nextHash}'">${label}</button></div>`;
  if (s.unit){
    const checks = stepChecks(s);
    const allDone = checks.length && checks.every(c => answered[c]);
    let reinforce = "";
    if (checks.length){
      const blocks = checks.map(c => quizHtml(DATA.assessments[c], { path: pid, step: stepIdx, checks })).join("");
      reinforce = `<section class="reinforce">
        <div class="rf-head"><span class="eyebrow" style="display:flex;align-items:center;gap:6px">${IC.learn} Reinforce what you just read</span>
          <span class="ck-done" id="reinforce-state">${allDone ? IC.check + " All checks passed — step complete" : `${checks.filter(c => answered[c]).length}/${checks.length} answered`}</span></div>
        ${blocks}</section>`;
    }
    const label = checks.length
      ? (stepIdx + 1 < p.steps.length ? "Next →" : "Finish path")
      : (stepIdx + 1 < p.steps.length ? "Mark done · Next →" : "Mark done · Finish");
    renderUnit(s.unit, reinforce + nav(label), true);
    return;
  }
  const a = DATA.assessments[s.assessment];
  const dCtx = a ? quizHtml(a, { path: pid, step: stepIdx, checks: [s.assessment] }) : `<p class="empty">Missing assessment.</p>`;
  $app.innerHTML = `<div class="eyebrow">${esc(p.title)} — question ${stepIdx + 1}/${p.steps.length}</div>
    ${dCtx}${nav(stepIdx + 1 < p.steps.length ? "Next →" : "Finish path")}`;
}

/* ---------------- search ---------------- */
function score(u, terms, phrase){
  let s = 0;
  for (const t of terms){
    if (!t) continue;
    if (u.title.toLowerCase().includes(t)) s += 10;
    if (u.tags && u.tags.join(" ").toLowerCase().includes(t)) s += 5;
    if (u.id.includes(t)) s += 5;
    if (u.search.includes(t)) s += 1;
  }
  if (phrase && terms.length > 1 && u.search.includes(phrase)) s += 6;
  return s;
}
function renderSearch(q){
  q = (q || "").trim();
  document.getElementById("q").value = q;
  if (!q){ $app.innerHTML = `<h1 class="view-title">Search</h1><p class="lede">Type to search titles, tags and full text.</p>`; return; }
  const phrase = q.toLowerCase();
  const terms = phrase.split(/\s+/);
  const hits = Object.values(U)
    .filter(u => u.status !== "deprecated")
    .map(u => [score(u, terms, phrase), u])
    .filter(x => x[0] > 0)
    .sort((a, b) => b[0] - a[0] || a[1].title.localeCompare(b[1].title))
    .slice(0, 40);
  $app.innerHTML = `<h1 class="view-title">Search</h1>
    <p class="lede">${hits.length} result${hits.length === 1 ? "" : "s"} for “${esc(q)}”.</p>
    <ul class="results">${hits.map(([, u]) => `<li>${unitCard(u)}</li>`).join("") || `<p class="empty">No matches.</p>`}</ul>`;
}
const $q = document.getElementById("q");
let qTimer = null;
$q.addEventListener("input", () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { location.hash = "#/search?q=" + encodeURIComponent($q.value); }, 220);
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $q && document.activeElement.tagName !== "TEXTAREA" && document.activeElement.tagName !== "INPUT"){
    e.preventDefault(); $q.focus();
  }
});

/* ---------------- graph (no-lib force layout; precedent: dq-studio explorer.js) ----------------
   Redesigned for usability: filter by knowledge type + domain, domain clustering with labelled
   centroids, labels only where they earn their place (high-degree, small graphs, focus, hover). */
const TYPE_COLOR_LIGHT = { concept:"#365EB9", principle:"#232F63", standard:"#5B30EE", procedure:"#6F8BD9", reference:"#83AFF8", glossary:"#BCAFFF", qa:"#190033" };
const TYPE_COLOR_DARK  = { concept:"#83AFF8", principle:"#A693F7", standard:"#8B6CF3", procedure:"#6F8BD9", reference:"#5B8DEF", glossary:"#BCAFFF", qa:"#C9B8FF" };
let TYPE_COLOR = TYPE_COLOR_LIGHT;
function syncGraphPalette(){ TYPE_COLOR = document.documentElement.getAttribute("data-theme") === "dark" ? TYPE_COLOR_DARK : TYPE_COLOR_LIGHT; }
let graphAnim = null;
/* Default scope = the methodology skeleton. Glossary/reference/qa are opt-in — with them on,
   400 units and 2000+ edges make an unreadable hairball. */
const graphState = { types: null, domain: null };
function renderGraph(focusId){
  syncGraphPalette();
  if (!graphState.types) graphState.types = new Set(["concept", "principle", "standard", "procedure"]);
  const domains = [...new Set(DATA.graph.nodes.map(n => n.domain))].sort();
  const typeChips = Object.keys(TAX.types).map(t =>
    `<button class="chip gt-chip ${graphState.types.has(t) ? "on" : ""}" style="${graphState.types.has(t) ? `background:${TYPE_COLOR[t]};border-color:${TYPE_COLOR[t]};color:${t === "reference" || t === "glossary" ? "var(--navy)" : "#fff"}` : ""}"
      onclick="toggleGraphType('${t}','${focusId || ""}')">${esc(TAX.types[t].label)}</button>`).join("");
  const domSel = `<select class="rv-in gd-sel" onchange="graphState.domain=this.value||null;renderGraph(${focusId ? `'${focusId}'` : "null"})">
      <option value="">all domains</option>
      ${domains.map(d => `<option value="${esc(d)}" ${graphState.domain === d ? "selected" : ""}>${esc(d)}</option>`).join("")}</select>`;

  let nodes = DATA.graph.nodes.filter(n => n.status !== "deprecated" && graphState.types.has(n.type) && (!graphState.domain || n.domain === graphState.domain));
  let idset = new Set(nodes.map(n => n.id));
  let edges = DATA.graph.edges.filter(e => idset.has(e.s) && idset.has(e.t));
  if (focusId && DATA.graph.nodes.find(n => n.id === focusId)){
    const all = DATA.graph.nodes, allEdges = DATA.graph.edges;
    const keep = new Set([focusId]);
    allEdges.forEach(e => { if (e.s === focusId) keep.add(e.t); if (e.t === focusId) keep.add(e.s); });
    nodes = all.filter(n => keep.has(n.id));
    idset = new Set(nodes.map(n => n.id));
    edges = allEdges.filter(e => idset.has(e.s) && idset.has(e.t));
  }
  $app.innerHTML = `<h1 class="view-title">Methodology graph</h1>
    <p class="lede">${focusId ? `Focused on <b>${esc(U[focusId] ? U[focusId].title : focusId)}</b> — its 1-hop neighbourhood. <a href="#/graph">Show full graph</a>.`
      : `Filter by knowledge type and domain, then explore. Nodes cluster by domain; drag to pan, scroll to zoom, hover for names, click to open.`}</p>
    <div class="facets">${typeChips}${domSel}<span class="chip" style="cursor:default;border:none;background:none">${nodes.length} units · ${edges.length} links</span></div>
    <div class="card" id="graph-wrap"><svg id="graph-svg"></svg>
      <div class="graph-legend">${Object.keys(TYPE_COLOR).filter(t => graphState.types.has(t)).map(t => `<span><i style="background:${TYPE_COLOR[t]}"></i>${t}</span>`).join("")}</div></div>`;
  if (!nodes.length){ document.getElementById("graph-wrap").innerHTML = `<p class="empty">Nothing matches these filters.</p>`; return; }
  runForce(nodes, edges, focusId);
}
function toggleGraphType(t, focusId){
  if (graphState.types.has(t) && graphState.types.size === 1) graphState.types = new Set(Object.keys(TAX.types));
  else if (graphState.types.has(t)) graphState.types.delete(t);
  else graphState.types.add(t);
  renderGraph(focusId || null);
}
function runForce(nodes, edges, focusId){
  const svg = document.getElementById("graph-svg");
  const W = svg.clientWidth || 1000, H = svg.clientHeight || 640;
  // domain clustering: each domain gets a centroid on an ellipse around the centre
  const domains = [...new Set(nodes.map(n => n.domain))].sort();
  const centroid = {};
  const clusterR = domains.length > 1 ? Math.min(W, H) * 0.33 : 0;
  domains.forEach((d, i) => {
    const a = (i / domains.length) * 2 * Math.PI - Math.PI / 2;
    centroid[d] = { x: W/2 + Math.cos(a) * clusterR * 1.25, y: H/2 + Math.sin(a) * clusterR };
  });
  const N = nodes.map((n, i) => {
    const c = centroid[n.domain] || { x: W/2, y: H/2 };
    return {...n, x: c.x + Math.cos(i * 2.399) * 40 * Math.sqrt(1 + i % 7), y: c.y + Math.sin(i * 2.399) * 30 * Math.sqrt(1 + i % 5), vx: 0, vy: 0};
  });
  const byId = {}; N.forEach(n => byId[n.id] = n);
  const deg = {}; edges.forEach(e => { deg[e.s] = (deg[e.s]||0)+1; deg[e.t] = (deg[e.t]||0)+1; });
  const showAllLabels = N.length <= 90;
  let tick = 0, view = { x: 0, y: 0, k: 1 };
  const maxTicks = Math.min(300, 80 + N.length * 2);
  function step(){
    tick++;
    const rep = N.length > 150 ? 1000 : 1700;
    for (let i = 0; i < N.length; i++){
      for (let j = i + 1; j < N.length; j++){
        const a = N[i], b = N[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let d2 = dx*dx + dy*dy || 1;
        if (d2 > 32000) continue;
        const f = rep / d2;
        const d = Math.sqrt(d2);
        dx /= d; dy /= d;
        a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
      }
    }
    const springK = N.length > 150 ? 0.006 : 0.012;   // weak springs on big graphs — clusters win
    edges.forEach(e => {
      const a = byId[e.s], b = byId[e.t];
      if (!a || !b) return;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx*dx + dy*dy) || 1;
      const f = (d - 80) * springK;
      a.vx += dx/d * f; a.vy += dy/d * f; b.vx -= dx/d * f; b.vy -= dy/d * f;
    });
    N.forEach(n => {
      const c = centroid[n.domain] || { x: W/2, y: H/2 };
      n.vx += (c.x - n.x) * 0.03; n.vy += (c.y - n.y) * 0.03;   // cluster gravity dominates
      n.vx *= 0.82; n.vy *= 0.82;
      n.x += n.vx; n.y += n.vy;
    });
    draw();
    if (tick < maxTicks) graphAnim = requestAnimationFrame(step);
  }
  function draw(){
    const eh = edges.map(e => {
      const a = byId[e.s], b = byId[e.t];
      return a && b ? `<line class="gedge" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"></line>` : "";
    }).join("");
    const ch = domains.length > 1 ? domains.map(d =>
      `<text class="gdom" x="${centroid[d].x}" y="${centroid[d].y - clusterR * 0.42 - 8}">${esc(d)}</text>`).join("") : "";
    const zoomedIn = view.k >= 1.5;
    const nh = N.map(n => {
      const dg = deg[n.id] || 0;
      const r = 4 + Math.min(8, dg * 1.1) + (n.id === focusId ? 4 : 0);
      const showLabel = showAllLabels || zoomedIn || n.id === focusId || dg >= 5;
      const label = showLabel ? `<text x="${n.x + r + 3}" y="${n.y + 3}">${esc(n.title.length > 30 ? n.title.slice(0, 28) + "…" : n.title)}</text>` : "";
      return `<g class="gnode" data-id="${esc(n.id)}"><title>${esc(n.title)}</title><circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${TYPE_COLOR[n.type] || "#365EB9"}"></circle>${label}</g>`;
    }).join("");
    svg.innerHTML = `<g transform="translate(${view.x},${view.y}) scale(${view.k})">${eh}${ch}${nh}</g>`;
  }
  if (graphAnim) cancelAnimationFrame(graphAnim);
  step();
  svg.onclick = e => {
    const g = e.target.closest(".gnode");
    if (g) location.hash = "#/unit/" + g.dataset.id;
  };
  let drag = null;
  svg.onmousedown = e => { drag = { x: e.clientX - view.x, y: e.clientY - view.y }; svg.style.cursor = "grabbing"; };
  window.onmousemove = e => { if (drag){ view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; draw(); } };
  window.onmouseup = () => { drag = null; svg.style.cursor = "grab"; };
  svg.onwheel = e => {
    e.preventDefault();
    const k = Math.max(.3, Math.min(3.5, view.k * (e.deltaY < 0 ? 1.12 : 0.89)));
    view.k = k; draw();
  };
}

/* ---------------- review mode ---------------- */
let reviewOn = false;
const rvToggle = document.getElementById("rv-toggle");
const rvBadge = document.getElementById("rv-badge");
function changeset(){ return store.get("em.changeset.v1", { ops: [] }); }
function saveChangeset(cs){ store.set("em.changeset.v1", cs); refreshBadge(); renderRvPanel(); }
function refreshBadge(){
  const n = changeset().ops.length;
  rvBadge.hidden = n === 0;
  rvBadge.textContent = n;
}
rvToggle.onclick = () => {
  reviewOn = !reviewOn;
  rvToggle.classList.toggle("on", reviewOn);
  const bar = document.getElementById("rv-unit-bar");
  if (bar) bar.hidden = !reviewOn;
  renderRvPanel();
};
function renderRvPanel(){
  let panel = document.getElementById("rv-panel");
  if (!reviewOn){ if (panel) panel.remove(); return; }
  if (!panel){
    panel = document.createElement("div");
    panel.id = "rv-panel";
    panel.className = "card rv-panel";
    document.body.appendChild(panel);
  }
  const cs = changeset();
  const lines = cs.ops.map((op, i) =>
    `<div class="op-line"><b>${esc(op.op)}</b> ${esc(op.unit_id || "(corpus)")} — ${esc((op.text || op.reason || "proposed edit").slice(0, 60))}
     <a href="javascript:void 0" onclick="rvRemove(${i})" style="float:right">✕</a></div>`).join("");
  panel.innerHTML = `<div class="h">Your changeset <span>${cs.ops.length} op${cs.ops.length === 1 ? "" : "s"}</span></div>
    ${lines || `<div class="op-line" style="border:none">Nothing yet — use the buttons on any unit, or ask a corpus-level question.</div>`}
    <div class="rv-actions">
      <button class="btn small" onclick="rvQuestion(null)">${IC.question} Corpus question</button>
      <button class="btn small primary" onclick="rvExport()" ${cs.ops.length ? "" : "disabled"}>${IC.download} Export JSON</button>
      <button class="btn small" onclick="rvClear()" ${cs.ops.length ? "" : "disabled"}>Clear</button></div>`;
}
function rvRemove(i){ const cs = changeset(); cs.ops.splice(i, 1); saveChangeset(cs); }
function rvClear(){ if (confirm("Discard all pending ops?")){ saveChangeset({ ops: [] }); } }
function dlg(inner, onOk){
  const d = document.createElement("dialog");
  d.className = "rv-dlg";
  d.innerHTML = inner + `<div class="rv-actions" style="justify-content:flex-end">
    <button class="btn" value="cancel">Cancel</button><button class="btn primary" value="ok">Add to changeset</button></div>`;
  document.body.appendChild(d);
  d.querySelector(".btn:not(.primary)").onclick = () => d.close("cancel");
  d.querySelector(".btn.primary").onclick = () => { if (onOk(d) !== false) d.close("ok"); };
  d.addEventListener("close", () => d.remove());
  d.showModal();
}
function rvEdit(id){
  const u = U[id];
  dlg(`<div class="dlg-h">Propose an edit — ${esc(u.title)}</div>
    <p class="lede" style="margin-bottom:var(--sp-3)">Edit the unit's markdown. Your proposal is applied only if the unit hasn't changed since this build (hash-checked), otherwise it goes to triage.</p>
    <textarea class="rv-ta" id="rv-ta">${esc(u.md)}</textarea>`,
    d => {
      const body = d.querySelector("#rv-ta").value;
      if (body === u.md){ alert("No change made."); return false; }
      const cs = changeset();
      cs.ops.push({ op: "edit", unit_id: id, base_hash: u.hash, new_body: body });
      saveChangeset(cs);
    });
}
function rvNote(id){
  dlg(`<div class="dlg-h">Add a note — ${esc(U[id].title)}</div>
    <input class="rv-in" id="rv-anchor" placeholder="Optional: which section? (e.g. ## Why)" style="margin-bottom:var(--sp-2)">
    <textarea class="rv-ta" id="rv-ta" style="min-height:110px" placeholder="Your note for the CoE…"></textarea>`,
    d => {
      const text = d.querySelector("#rv-ta").value.trim();
      if (!text) return false;
      const cs = changeset();
      cs.ops.push({ op: "note", unit_id: id, anchor: d.querySelector("#rv-anchor").value.trim() || null, text });
      saveChangeset(cs);
    });
}
function rvQuestion(id){
  dlg(`<div class="dlg-h">Ask a question${id ? " — " + esc(U[id].title) : ""}</div>
    <p class="lede" style="margin-bottom:var(--sp-3)">Questions the material can't answer become new Q&amp;A content — asking one improves the base for everyone.</p>
    <textarea class="rv-ta" id="rv-ta" style="min-height:110px" placeholder="What do you need to know?"></textarea>`,
    d => {
      const text = d.querySelector("#rv-ta").value.trim();
      if (!text) return false;
      const cs = changeset();
      cs.ops.push({ op: "question", unit_id: id, text });
      saveChangeset(cs);
    });
}
function rvFlag(id){
  dlg(`<div class="dlg-h">Flag — ${esc(U[id].title)}</div>
    <select class="rv-in" id="rv-reason" style="margin-bottom:var(--sp-2)">
      <option value="outdated">Outdated</option><option value="wrong">Factually wrong</option>
      <option value="conflict">Conflicts with another unit</option><option value="unclear">Unclear</option></select>
    <textarea class="rv-ta" id="rv-ta" style="min-height:90px" placeholder="What's the issue?"></textarea>`,
    d => {
      const text = d.querySelector("#rv-ta").value.trim();
      if (!text) return false;
      const cs = changeset();
      cs.ops.push({ op: "flag", unit_id: id, reason: d.querySelector("#rv-reason").value, text });
      saveChangeset(cs);
    });
}
function rvExport(){
  let author = store.get("em.author.v1", "");
  author = prompt("Your name (goes on the changeset):", author || "");
  if (author === null) return;
  store.set("em.author.v1", author);
  const cs = changeset();
  const payload = {
    schema: "em-changeset/1",
    exported_at: new Date().toISOString(),
    author: author || "anonymous",
    app_build: DATA.build.id,
    ops: cs.ops
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "em-changeset-" + (author || "anon").toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + payload.exported_at.slice(0, 10) + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}
document.getElementById("theme-toggle").onclick = () =>
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark", true);
applyTheme(document.documentElement.getAttribute("data-theme") || "light", false);
window.__emReady = true;
syncGraphPalette();
refreshBadge();
route();
</script>
</body>
